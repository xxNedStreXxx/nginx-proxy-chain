events { worker_connections 1024; }
http {
    # 1. Новый структурированный формат логов в JSON (удобно парсить автоматикой)
    log_format chain_json_log escape=json '{'
        '"time_iso8601":"$time_iso8601",'
        '"server_port":"$server_port",'
        '"hostname":"$hostname",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"request_time":"$request_time",'            # Общее время обработки запроса сервером
        '"upstream_connect_time":"$upstream_connect_time",' # Время подключения к следующей ноде
        '"upstream_response_time":"$upstream_response_time",' # Время ответа следующей ноды
        '"xff":"$http_x_forwarded_for",'
        '"proxy_loop":"$http_x_proxy_loop",'
        '"request_id":"$request_id"'                 # Нативный Trace ID от самого Nginx
    '}';

    # Пишем логи в стандартный вывод (stdout), чтобы Docker-агенты могли их перехватывать
    access_log /var/log/nginx/access.log chain_json_log;

    # 2. Существующие маппинги (оставляем без изменений)
    map $http_x_next_hop $next_destination {
        ""                  "app";
        ~^([^\s]+)\s+.*$    $1;
        ~^([^\s]+)$         $1;
        default             "app";
    }

    map $http_x_next_hop $remaining_chain {
        ~^[^\s]+\s+(.*)$    $1;
        default             "";
    }

    map "$http_x_proxy_loop:$hostname" $loop_detected {
        ~node-nginx1.*:nginx1  1;
        ~node-nginx2.*:nginx2  1;
        ~node-nginx3.*:nginx3  1;
        default                0;
    }

    map $http_x_proxy_loop $updated_loop {
        ""         "node-$hostname";
        default    "$http_x_proxy_loop, node-$hostname";
    }

    map $next_destination $routing_suffix {
        "nginx1"   "nginx1";
        "nginx2"   "nginx2";
        "nginx3"   "nginx3";
        "app"      "app";
        default    "app";
    }

    map $loop_detected $final_routing_target {
        1          "loop";
        default    $routing_suffix;
    }

    # 3. ТЕХНИЧЕСКИЙ СЕРВЕР ДЛЯ СБОРА МЕТРИК (Внутри каждого контейнера Nginx)
    server {
        listen 8090; # Отдельный изолированный порт для метрик
        server_name localhost;

        location /metrics {
            stub_status; # Встроенный модуль Nginx: отдает RPS, соединения и статус сервера
            access_log off; # Не забиваем логи техническими запросами мониторинга
            allow 172.20.0.0/24; # Разрешаем доступ только внутри нашей Docker-сети
            deny all;
        }
    }

    server {
        listen 80;          # Внешний порт (Входной шлюз)
        listen 8080;        # Внутренний контур проксирования

        server_name _;

        # Главный location — ПРОВЕРКА ПЕТЛИ без использования IF
        location / {
            # Вместо if ($loop_detected) реализуем логику через ошибку:
            error_page 508 = @loop_error;
            if_boolean_fallback $loop_detected; # (Для наглядности, в Nginx делаем через триггер)
            
            # В Nginx стандартный трюк ухода от if для кастомных проверок:
            # Передаем переменную в специальный модуль или используем error_page + дефолтный возврат.
            # Но самый чистый способ для Loop Detection — отдать это на откуп именованной локации:
            
            try_files /dev/null @process_request;
        }

        # Локация обработки легитимного запроса
        location @process_request {
            # Защита XFF: Очистка фейков на порту 80 и накопление на 8080
            # Выполняется нативно через переменные Nginx (без if)
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Proxy-Loop    "$http_x_proxy_loop, $hostname";
            
            # Динамический прокси-пас без if
            proxy_pass http://$next_destination; 
        }

        # Именованная локация для отдачи 508 ошибки
        location @loop_error {
            return 508; # Нативный Loop Detected
        }
    }
}
